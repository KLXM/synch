package: synch
version: '2.0.0'
author: 'KLXM Crossmedia GmbH'
supportpage: 'https://github.com/KLXM/synch'
license: MIT

page:
    title: 'translate:synch_title'
    perm: admin
    icon: rex-icon fa-refresh
    subpages:
        settings: { title: 'translate:synch_settings' }
        help: { title: 'translate:synch_help', subPath: README.md, itemClass: 'pull-right' }

requires:
    redaxo: '^5.15.0'

default_config:
    sync_frontend: false
    sync_backend: false
    sync_direction: 'files_to_db'
    conflict_strategy: 'newer_wins'
    update_existing_on_key_conflict: true
    allow_empty_filesystem_cleanup: false

console_commands:
    synch:sync: KLXM\Synch\SyncCommand